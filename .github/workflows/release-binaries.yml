name: Release Binaries

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Same pinned toolchain as the CI gate (rust.yml, ADR-0012). Bump them together.
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_name: skillet-macos-x86_64

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: skillet-macos-arm64

          # Linux x86_64 (musl for Alpine compatibility)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_name: skillet-linux-x86_64
            use_cross: true

          # Linux ARM64 (musl for Alpine compatibility)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive_name: skillet-linux-arm64
            use_cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux musl builds)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      # --locked: fail instead of resolving new dependency versions, so the
      # binaries are built from exactly the committed Cargo.lock.
      - name: Build binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }} --bins
          else
            cargo build --locked --release --target ${{ matrix.target }} --bins
          fi
        shell: bash

      - name: Create archive
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar czf ../../../dist/${{ matrix.archive_name }}.tar.gz \
            sk \
            sk_server \
            sk_client \
            sk_http_server \
            sk_http_bench
          cd ../../..

      # SHA-256 checksum next to the archive, in the same artifact, so manual
      # (workflow_dispatch) builds carry checksums too. macOS has no sha256sum.
      - name: Create checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.archive_name }}.tar.gz > ${{ matrix.archive_name }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.archive_name }}.tar.gz > ${{ matrix.archive_name }}.tar.gz.sha256
          fi
          cat ${{ matrix.archive_name }}.tar.gz.sha256

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/*
          retention-days: 1

  publish-release:
    name: Publish Release Assets
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')  # Only publish to release if there's a tag
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # Every archive must have a checksum from its build job, and it must match.
      - name: Verify checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sh -c '
            for file; do
              dir=$(dirname "$file")
              base=$(basename "$file")
              test -f "$file.sha256" || { echo "missing checksum: $file" >&2; exit 1; }
              (cd "$dir" && sha256sum -c "$base.sha256") || exit 1
            done
          ' sh {} +

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
          prerelease: false  # Mark as stable release, not prerelease
          draft: false       # Publish immediately, not as draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
