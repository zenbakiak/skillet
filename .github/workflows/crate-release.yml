name: Crate Release

on:
  push:
    tags:
      - 'crate-v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same pinned toolchain as the CI gate (rust.yml, ADR-0012). Bump them together.
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          TAG_VER="${TAG_REF#crate-v}"
          CARGO_VER=$(sed -n -E 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          echo "Tag version: $TAG_VER"
          echo "Cargo.toml version: $CARGO_VER"
          if [[ "$TAG_VER" != "$CARGO_VER" ]]; then
            echo "Error: tag version ($TAG_VER) does not match Cargo.toml version ($CARGO_VER)" >&2
            exit 1
          fi

      # --locked everywhere: fail instead of resolving new dependency versions,
      # so what is tested is exactly what the committed Cargo.lock describes.
      - name: Build and test
        run: |
          cargo build --locked --verbose
          cargo test --locked --verbose

      - name: Package (dry run)
        run: cargo package --locked --verbose

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked --verbose

