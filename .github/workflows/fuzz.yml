name: Fuzz

# Scheduled fuzzing of the parser and evaluator (BL-019, ADR-0028).
# Not a required check: it never runs on push or pull_request.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly (sanitizer flags). Pinned so a nightly regression cannot turn the
  # job red on its own; bump it on purpose.
  FUZZ_TOOLCHAIN: "nightly-2025-08-04"
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Build plus the fuzz time; keep `minutes` below ~75.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [parse, evaluate, json_vars]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust ${{ env.FUZZ_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}

      # cargo-fuzz has no --locked; this fails if fuzz/Cargo.lock is missing or out of date.
      - name: Fetch dependencies (locked)
        run: cargo +${{ env.FUZZ_TOOLCHAIN }} fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Build
        run: cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz build -a ${{ matrix.target }}

      - name: Fuzz for ${{ inputs.minutes || '10' }} minutes
        env:
          MINUTES: ${{ inputs.minutes || '10' }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz run -a ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- \
            -max_total_time=$((MINUTES * 60)) -timeout=10 -max_len=4096 -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  # Open (or update) one issue when any target fails, so a crash is not missed (ADR-0028).
  report:
    name: report fuzz failure
    needs: fuzz
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the fuzz issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          gh label create fuzz --color B60205 --description "Fuzzer found a crash" 2>/dev/null || true
          existing=$(gh issue list --label fuzz --state open --json number --jq '.[0].number')
          body="The scheduled fuzz run failed: $RUN_URL

          Download the \`fuzz-artifacts-<target>\` artifact from the run, then reproduce and
          minimize the input as described in docs/adr/0028-fuzzing.md."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Fuzzing found a failure" --label fuzz \
              --assignee "$ASSIGNEE" --body "$body"
          fi
