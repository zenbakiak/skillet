openapi: 3.0.3
info:
  title: Skillet HTTP Server API
  description: |
    A high-performance mathematical and logical expression evaluation server with JavaScript function management capabilities.
    
    ## Features
    - Expression evaluation with variables and arguments
    - Custom JavaScript function management
    - Expression caching for performance
    - Thread-based concurrent processing
    - Optional token-based authentication
    
    ## Authentication
    - **Eval Token**: Optional authentication for expression evaluation endpoints
    - **Admin Token**: Required authentication for JavaScript function management endpoints
    
    Tokens are passed via the `Authorization` header.

    ## Server configuration (`sk_http_server`)
    | Flag | Environment variable | Meaning |
    |---|---|---|
    | `--token` | `SKILLET_AUTH_TOKEN` | Eval token |
    | `--admin-token` | `SKILLET_ADMIN_TOKEN` | Admin token (JS management, `DELETE /cache`) |
    | `--cors-origin` | `SKILLET_CORS_ORIGIN` | `Access-Control-Allow-Origin` value |
    | `--max-connections-per-ip` | `SKILLET_MAX_CONNECTIONS_PER_IP` | Open connections allowed from one IP address (default: no limit) |
    | `--eval-timeout` | `SKILLET_EVAL_TIMEOUT` | Wall-clock limit for one evaluation, whole seconds from 1 to 86400 (default: 20) |
    | `--max-eval-bytes` | `SKILLET_MAX_EVAL_BYTES` | Budget of values one evaluation may create, in bytes; suffixes `K`, `M`, `G` mean KiB, MiB, GiB (default: `256M`, the library's `MAX_EVAL_BYTES`) |

    The flag wins over the environment variable. An empty value is refused at start-up, and so
    are `0` and invalid numbers for the numeric settings. If only one token is set, the other
    one inherits it. Worst-case memory for evaluations is about threads × `--max-eval-bytes`
    (8 threads × 256 MiB = 2 GiB with the default budget); size the host for it. ADR-0011
    amendment 4.

    ## Cross-origin requests (CORS)
    `Access-Control-Allow-Origin` is the configured origin (any value, `*` included). Without
    one, it is `*` when a token is configured, and absent in development mode (no token), so
    pages on other origins cannot read responses. `OPTIONS` (preflight) answers 200 with the
    same `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods: GET, POST, PUT,
    DELETE, OPTIONS` and `Access-Control-Allow-Headers: Authorization, Content-Type`, or with
    no CORS headers in development mode. See ADR-0019.

    ## Request bodies
    A request with a body (`Content-Length` over 0) other than `GET`/`OPTIONS` must send
    `Content-Type: application/json` (parameters such as `; charset=utf-8` are allowed; the
    media type is case-insensitive). Otherwise the server answers HTTP 415 with
    `"error": "Content-Type must be application/json"`, before checking tokens.
    `/upload-js` and `/update-js` also accept `multipart/form-data`.

    ## Browser requests in development mode
    With no admin token configured, the admin endpoints (`/upload-js`, `/update-js`,
    `/delete-js`, `/list-js`, `/reload-hooks`, `DELETE /cache`) answer HTTP 403 to any request
    with an `Origin` header, whatever its method and body, with an error that says to set an
    admin token.

    ## Request limits
    - A request (headers + body) may be at most 1 MB (1,048,576 bytes). A larger request, or a
      `Content-Length` over 1 MB, gets HTTP 413 on any path.
    - The whole request must arrive within 30 s of the first read. Otherwise the server answers
      HTTP 408 on any path.
    - After a 413 or 408 the server reads and discards the rest of the request until the client
      closes or the 30 s pass, then closes, so the client receives the error.
    - Writing one response may take at most 10 s in total. If the client reads more slowly, the
      server stops writing and closes the connection: the client gets a body shorter than
      `Content-Length` and no error message. Reading the largest results (up to the evaluation
      budget, 256 MiB by default) in time needs about 25 MB/s.
    - Evaluation limits (nesting depth, the budget and the evaluation deadline, 256 MiB and 20 s
      by default) are described on `/eval` and in docs/guide/limits.md. The 30 s read and 10 s
      write limits do not change with them.

    ## Connection limit
    With `--max-connections-per-ip N` (or `SKILLET_MAX_CONNECTIONS_PER_IP`), a connection from
    an IP address that already has N open connections is answered at once with HTTP 429 and
    `"error": "Too many connections from this address (max N)"`, then closed; it never reaches
    a worker. `0`, an empty value or text is refused at start-up. Without the setting there is
    no limit. Behind a reverse proxy every client has the proxy's address, so set the limit at
    the proxy instead. See ADR-0025.

    ## Builds without the `plugins` feature
    The JavaScript endpoints (`/upload-js`, `/update-js`, `/delete-js`, `/list-js`,
    `/reload-hooks`) check the admin token, then answer HTTP 404 with
    `"error": "JavaScript plugins are not enabled in this build"`, for any method.
  version: 0.4.1
  contact:
    name: Skillet Lang
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:5074
    description: Local development server
  - url: http://localhost:5074
    description: Local server
tags:
  - name: evaluation
    description: Expression evaluation operations
  - name: health
    description: Server health and monitoring
  - name: javascript
    description: JavaScript function management
  - name: cache
    description: Cache management operations

paths:
  /:
    get:
      tags: [health]
      summary: Get API documentation
      description: Returns HTML documentation page with API endpoints and examples
      responses:
        '200':
          description: HTML documentation page
          content:
            text/html:
              schema:
                type: string
                example: "<!DOCTYPE html><html>..."
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /health:
    get:
      tags: [health]
      summary: Health check
      description: Get server health status, statistics, and cache performance metrics
      security:
        - evalToken: []
        - {}
      responses:
        '200':
          description: Server health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                version: "0.4.1"
                requests_processed: 1542
                avg_execution_time_ms: 2.34
                cache_stats:
                  hits: 856
                  misses: 686
                  hit_rate: 0.555
                  entries: 150
                  evictions: 12
                  total_saved_time_ms: 1248.67
                parse_cache:
                  hits: 640
                  misses: 46
                  hit_rate: 0.933
                  entries: 38
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /eval:
    post:
      tags: [evaluation]
      summary: Evaluate expression (JSON)
      description: |
        Evaluate mathematical and logical expressions with optional variables and arguments.
        
        ## Expression Format
        - Expressions can start with `=` (optional)
        - Variables are prefixed with `:` (e.g., `:x`, `:total`)
        - Supports arithmetic, logical, and comparison operations
        - Custom JavaScript functions available
        
        ## Examples
        - `=2 + 3 * 4` → 14
        - `:x + :y` with arguments `{"x": 10, "y": 20}` → 30
        - `MX_ISR(21000, "semanal")` → Custom JS function call
      security:
        - evalToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRequest'
            examples:
              simple:
                summary: Simple arithmetic
                value:
                  expression: "=2 + 3 * 4"
              with_variables:
                summary: Expression with variables
                value:
                  expression: ":x + :y * 2"
                  arguments:
                    x: 10
                    y: 5
                  output_json: true
              selective_variables:
                summary: Return specific variables only
                value:
                  expression: ":a := 10; :b := 20; :c := :a + :b"
                  include_variables: ":a,:b"
      responses:
        '200':
          description: Expression evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalResponse'
              examples:
                success:
                  summary: Successful evaluation
                  value:
                    success: true
                    result: 14
                    execution_time_ms: 1.23
                    request_id: 42
                with_variables:
                  summary: Result with variables
                  value:
                    success: true
                    result: 30
                    variables:
                      x: 10
                      y: 20
                    execution_time_ms: 2.15
                    request_id: 43
        '400':
          description: |
            Invalid expression or request format, or an evaluation limit was hit:
            `Expression nested too deeply (max 128)`, `Evaluation budget exceeded (max 256 MB)`
            (also returned when the serialized result would exceed the budget), or
            `Evaluation timed out (max 20 s)`. The numbers are the server's configured limits
            (`--max-eval-bytes`, `--eval-timeout`; shown here with the defaults). See
            docs/guide/limits.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyConnections'

    get:
      tags: [evaluation]
      summary: Evaluate expression (URL parameters)
      description: |
        Evaluate expressions using URL query parameters. Useful for simple expressions and browser testing.
        
        ## Query Parameters
        - `expr` or `expression`: The expression to evaluate
        - `output_json`: Set to "true" for JSON output format
        - Variable arguments: `x=10&y=20` etc.
      security:
        - evalToken: []
        - {}
      parameters:
        - name: expr
          in: query
          required: true
          description: The expression to evaluate
          schema:
            type: string
          example: "2 + 3 * 4"
        - name: expression
          in: query
          required: false
          description: Alternative parameter name for expression
          schema:
            type: string
        - name: output_json
          in: query
          required: false
          description: Return result in JSON format
          schema:
            type: string
            enum: ["true", "false"]
        - name: include_variables
          in: query
          required: false
          description: Include variables in response (true/false or comma-separated list)
          schema:
            type: string
          example: "true"
      responses:
        '200':
          description: Expression evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalResponse'
            text/plain:
              schema:
                type: string
                example: "14"
        '400':
          description: |
            Missing or invalid expression, or an evaluation limit was hit (same texts as
            POST /eval). See docs/guide/limits.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /upload-js:
    post:
      tags: [javascript]
      summary: Upload JavaScript function
      description: |
        Upload and validate a new JavaScript function. Supports both JSON and multipart form-data uploads.

        `filename` must be a plain name matching `^[A-Za-z0-9_-]+\.js$`; the file is saved
        directly in the hooks directory. Any other name gets HTTP 400 (see the 400 example).
        
        ## JavaScript Function Format
        Functions must include metadata comments:
        ```javascript
        // @name: FUNCTION_NAME
        // @description: Function description
        // @example: FUNCTION_NAME(5, 10) returns 15
        // @min_args: 2
        // @max_args: 2
        
        function execute(args) {
            return args[0] + args[1];
        }
        ```
        
        ## Upload Methods
        1. **JSON**: Send `js_code` field with function content
        2. **Multipart**: Upload file with `filename` and `file` fields
      security:
        - adminToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadJSRequest'
            example:
              filename: "add_numbers.js"
              js_code: "// @name: ADD_NUMBERS\n// @description: Adds two numbers\n// @example: ADD_NUMBERS(5, 3) returns 8\n// @min_args: 2\n// @max_args: 2\n\nfunction execute(args) {\n    return args[0] + args[1];\n}"
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  pattern: '^[A-Za-z0-9_-]+\.js$'
                  description: 'Plain file name matching `^[A-Za-z0-9_-]+\.js$` (letters, digits, `_`, `-`, ending in `.js`; no directories). Anything else gets HTTP 400.'
                  example: "add_numbers.js"
                js_code:
                  type: string
                  description: JavaScript function code (alternative to file upload)
                file:
                  type: string
                  format: binary
                  description: JavaScript file upload (alternative to js_code)
              required:
                - filename
      responses:
        '200':
          description: Function uploaded and validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJSResponse'
              example:
                success: true
                message: "JavaScript function 'ADD_NUMBERS' uploaded and validated successfully"
                function_name: "ADD_NUMBERS"
                validation_results:
                  syntax_valid: true
                  structure_valid: true
                  example_test_passed: true
                  example_result: "Expected: 8, Got: 8 ✓"
        '400':
          description: |
            Invalid filename, invalid function, reserved function name, or validation failed.
            A name that does not end in `.js` gets `"message": "Filename must end with .js
            extension"` and `"error": "Invalid file extension"`; any other name outside the
            pattern (a dot or `/` in the stem, an empty stem) gets the `invalidFilename`
            example. An `@name` that is a builtin name or alias in any case (`SUM`, `sum`,
            `STDEV.P`) gets the `reservedName` example, with the name upper-cased; hooks cannot
            replace builtins (ADR-0024). Nothing is written in either case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJSResponse'
              examples:
                invalidFilename:
                  value:
                    success: false
                    message: "Filename must be a plain name of letters, digits, '_' or '-' ending in .js (no directories)"
                    function_name: null
                    validation_results: null
                    error: "Invalid filename"
                reservedName:
                  value:
                    success: false
                    message: "Function name SUM is reserved by a builtin"
                    function_name: null
                    validation_results: null
                    error: "Reserved function name"
        '401':
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: JavaScript plugins are not enabled in this build (server built without the `plugins` feature)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "JavaScript plugins are not enabled in this build"
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /update-js:
    put:
      tags: [javascript]
      summary: Update existing JavaScript function
      description: |
        Update an existing JavaScript function. The file must already exist.
        Supports both JSON and multipart form-data formats.

        `filename` must be a plain name matching `^[A-Za-z0-9_-]+\.js$`, so only files
        directly in the hooks directory can be updated. Hooks in subdirectories are still
        loaded and listed by `/list-js`, but this endpoint answers 400 for them.
      security:
        - adminToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJSRequest'
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  pattern: '^[A-Za-z0-9_-]+\.js$'
                  description: 'Name of the JavaScript file to update. Plain file name matching `^[A-Za-z0-9_-]+\.js$` (letters, digits, `_`, `-`, ending in `.js`; no directories). Anything else gets HTTP 400.'
                js_code:
                  type: string
                  description: Updated JavaScript function code
                file:
                  type: string
                  format: binary
                  description: Updated JavaScript file upload
              required:
                - filename
      responses:
        '200':
          description: Function updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateJSResponse'
        '400':
          description: |
            Invalid filename, invalid function, reserved function name, or validation failed;
            same messages as `/upload-js`. A reserved `@name` (any case) leaves the existing file
            unchanged (ADR-0024).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateJSResponse'
              examples:
                invalidFilename:
                  value:
                    success: false
                    message: "Filename must be a plain name of letters, digits, '_' or '-' ending in .js (no directories)"
                    function_name: null
                    validation_results: null
                    error: "Invalid filename"
                reservedName:
                  value:
                    success: false
                    message: "Function name SUM is reserved by a builtin"
                    function_name: null
                    validation_results: null
                    error: "Reserved function name"
        '404':
          description: |
            Function file not found, or JavaScript plugins are not enabled in this build
            (`"error": "JavaScript plugins are not enabled in this build"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateJSResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /delete-js:
    delete:
      tags: [javascript]
      summary: Delete JavaScript function
      description: |
        Delete an existing JavaScript function file from the hooks directory.
        `filename` must be a plain name matching `^[A-Za-z0-9_-]+\.js$`, so only files
        directly in the hooks directory can be deleted. Hooks in subdirectories are still
        loaded and listed by `/list-js`, but this endpoint answers 400 for them.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteJSRequest'
            example:
              filename: "old_function.js"
      responses:
        '200':
          description: Function deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteJSResponse'
        '400':
          description: Invalid filename (same messages as `/upload-js`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteJSResponse'
              example:
                success: false
                message: "Filename must be a plain name of letters, digits, '_' or '-' ending in .js (no directories)"
                error: "Invalid filename"
        '404':
          description: |
            JavaScript plugins are not enabled in this build (server built without the
            `plugins` feature). The body has no `message` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "JavaScript plugins are not enabled in this build"
        '500':
          description: |
            The file does not exist or could not be deleted. A missing file is a 500, not a
            404: the 404 above only means the plugins are not built in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteJSResponse'
              example:
                success: false
                message: "Failed to delete file 'old_function.js'"
                error: "File 'old_function.js' does not exist"
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /list-js:
    get:
      tags: [javascript]
      summary: List JavaScript functions
      description: |
        List all JavaScript functions in the hooks directory with detailed metadata,
        including validation status, function signatures, and file information.
        Subdirectories are included; their `filename` is the relative path
        (for example `math/double_it.js`). Such files cannot be updated or deleted through
        `/update-js` or `/delete-js`.
      security:
        - adminToken: []
      responses:
        '200':
          description: List of JavaScript functions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJSResponse'
              example:
                success: true
                total_count: 2
                functions:
                  - filename: "mx_isr.js"
                    function_name: "MX_ISR"
                    description: "Calculates ISR tax in mexico based on the monto and period"
                    example: "MX_ISR(21000, \"semanal\") returns 2817.603008"
                    min_args: 1
                    max_args: 2
                    file_size: 3682
                    last_modified: "2024-09-06 23:03:15 UTC"
                    is_valid: true
                  - filename: "add_numbers.js"
                    function_name: "ADD_NUMBERS"
                    description: "Adds two numbers together"
                    example: "ADD_NUMBERS(5, 3) returns 8"
                    min_args: 2
                    max_args: 2
                    file_size: 245
                    last_modified: "2024-09-07 08:15:32 UTC"
                    is_valid: true
        '401':
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: JavaScript plugins are not enabled in this build (server built without the `plugins` feature)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "JavaScript plugins are not enabled in this build"
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /reload-hooks:
    post:
      tags: [javascript]
      summary: Reload JavaScript functions
      description: |
        Reload all JavaScript functions from the hooks directory.
        This refreshes the function registry without restarting the server.
        A file whose `@name` is a builtin name (any case) is skipped with a warning on the
        server's stderr and is not counted in `functions_loaded` (ADR-0024).
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example: {}
      responses:
        '200':
          description: Functions reloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadHooksResponse'
              example:
                success: true
                message: "Successfully reloaded 3 JavaScript function(s)"
                functions_loaded: 3
        '404':
          description: JavaScript plugins are not enabled in this build (server built without the `plugins` feature)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "JavaScript plugins are not enabled in this build"
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyConnections'

  /cache:
    delete:
      tags: [cache]
      summary: Clear expression cache
      description: |
        Clear the expression evaluation cache to force re-evaluation of all expressions,
        and the parse cache: the parsed trees of every worker thread, and its `/health`
        counters. The worker that answers drops its trees at once; each other worker drops
        its own before its next request (a parsed tree cannot be shared between threads, see
        ADR-0021), so `parse_cache.entries` can stay above 0 until every worker has served a
        request. Useful for development and testing scenarios.
      security:
        - adminToken: []
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                example:
                  success: true
                  message: "Expression cache cleared successfully"
        '429':
          $ref: '#/components/responses/TooManyConnections'

components:
  responses:
    TooManyConnections:
      description: |
        Only when the server runs with `--max-connections-per-ip N` (or
        `SKILLET_MAX_CONNECTIONS_PER_IP`): this address already has N open connections. Sent
        before the request is read, with `Connection: close`. See "Connection limit".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Too many connections from this address (max 2)"
    PayloadTooLarge:
      description: |
        The request (headers + body) is over 1 MB, or its `Content-Length` is. Any path.
        See "Request limits".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Request body too large (max 1MB)"
    RequestTimeout:
      description: |
        The whole request did not arrive within 30 s of the first read. Any path.
        See "Request limits".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Request read timed out (max 30 s)"
    UnsupportedMediaType:
      description: |
        The request has a body but its `Content-Type` is not `application/json` (or, on
        `/upload-js` and `/update-js`, `multipart/form-data`). See "Request bodies".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Content-Type must be application/json"
  securitySchemes:
    evalToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token for expression evaluation endpoints, if enabled (`--token` or `SKILLET_AUTH_TOKEN`)
    adminToken:
      type: apiKey
      in: header
      name: Authorization
      description: Admin token for JavaScript function management endpoints and `DELETE /cache` (`--admin-token` or `SKILLET_ADMIN_TOKEN`)

  schemas:
    EvalRequest:
      type: object
      properties:
        expression:
          type: string
          description: The expression to evaluate (can be string or array of strings)
          example: ":x + :y * 2"
        arguments:
          type: object
          description: Variables to use in the expression
          additionalProperties: true
          example:
            x: 10
            y: 20
        output_json:
          type: boolean
          description: Whether to return result in JSON format
          default: false
        include_variables:
          oneOf:
            - type: boolean
            - type: string
          description: |
            Include variables in response:
            - `true`: Include all variables
            - `false`: No variables
            - `"var1,var2"`: Specific variables only
          example: true
      required:
        - expression

    EvalResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the evaluation succeeded
        result:
          description: The evaluation result
          example: 42
        variables:
          type: object
          description: Variables from the expression (if requested)
          additionalProperties: true
        error:
          type: string
          description: Error message if evaluation failed
        execution_time_ms:
          type: number
          description: Time taken to evaluate in milliseconds
        request_id:
          type: integer
          description: Unique request identifier
      required:
        - success
        - execution_time_ms
        - request_id

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy]
        version:
          type: string
          description: Server version
        requests_processed:
          type: integer
          description: Total number of requests processed
        avg_execution_time_ms:
          type: number
          description: Average execution time across all requests
        cache_stats:
          $ref: '#/components/schemas/CacheStatsResponse'
        parse_cache:
          $ref: '#/components/schemas/ParseCacheStatsResponse'
      required:
        - status
        - version
        - requests_processed
        - avg_execution_time_ms
        - parse_cache

    CacheStatsResponse:
      type: object
      properties:
        hits:
          type: integer
          description: Number of cache hits
        misses:
          type: integer
          description: Number of cache misses
        hit_rate:
          type: number
          description: Cache hit rate (0.0 to 1.0)
        entries:
          type: integer
          description: Current number of cached entries
        evictions:
          type: integer
          description: |
            Entries dropped because the cache was full (1,000 entries, least recently used
            first). Replacing an entry that is already cached is not counted. Reset by
            `DELETE /cache`.
        total_saved_time_ms:
          type: number
          description: Total time saved by caching

    ParseCacheStatsResponse:
      type: object
      description: |
        The cache of parsed expressions, summed over the worker threads. Each worker keeps
        its own (at most 256 expressions, 128 KiB of text). A lookup is a hit when the exact
        expression text was parsed before by that worker; a request answered from the result
        cache does not reach the parse cache. Reset by `DELETE /cache`.
      properties:
        hits:
          type: integer
          description: Lookups that reused a parsed tree
        misses:
          type: integer
          description: Lookups that parsed the expression (parse errors included)
        hit_rate:
          type: number
          description: hits / (hits + misses), 0.0 when there were none
        entries:
          type: integer
          description: Parsed trees stored, summed over the worker threads
      required:
        - hits
        - misses
        - hit_rate
        - entries

    UploadJSRequest:
      type: object
      properties:
        filename:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.js$'
          description: 'Plain file name matching `^[A-Za-z0-9_-]+\.js$` (letters, digits, `_`, `-`, ending in `.js`; no directories). Anything else gets HTTP 400.'
          example: "my_function.js"
        js_code:
          type: string
          description: JavaScript function code
        file_content:
          type: string
          description: File content (for multipart uploads)
      required:
        - filename

    UploadJSResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        function_name:
          type: string
          description: Extracted function name
        validation_results:
          $ref: '#/components/schemas/ValidationResults'
        error:
          type: string
      required:
        - success
        - message

