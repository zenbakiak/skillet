[package]
name = "skillet"
version = "0.6.3"
edition = "2024"
rust-version = "1.85"
description = "Skillet: micro expression language (arithmetic, logical, functions, arrays, conditionals, excel formulas) made in Rust bin cli and server"
license = "MIT OR Apache-2.0"
readme = "README.md"
# documentation will work after first publish
documentation = "https://docs.rs/skillet"
repository = "https://github.com/zenbakiak/skillet"
keywords = ["excel", "formula", "expression", "language", "eval"]

# Keep the published crate small and clean
include = [
  "Cargo.toml",
  "/README.md",
  "/CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "docs/guide/**",
  "docs/reference/**",
  "openapi.yml",
  "src/**",
  "tests/**"
]

[lib]
name = "skillet"
path = "src/lib.rs"

[dependencies]
# No `clock`: it links CoreFoundation on macOS (~1 ms per `sk` start). Local time comes from
# libc instead (src/runtime/local_time.rs, ADR-0020); other targets get `clock` below.
chrono = { version = "0.4.43", default-features = false, features = ["std", "now", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.5"
# Never enable rquickjs's `rust-alloc` or `allocator` features: with a custom allocator
# `Runtime::set_memory_limit` is a no-op, and JS plugins lose their 64 MiB cap (ADR-0017).
rquickjs = { version = "0.11", optional = true }
# High-performance dependencies
threadpool = "1.8"
num_cpus = "1.17"
# Daemon support
libc = "0.2"
ctrlc = "3.4"
# HTTP server support
urlencoding = "2.1"
lru = "0.19"
once_cell = "1.19"
jsonpath-rust = "1.0"

# Targets without the libc local-time path (must match the cfg in src/runtime/local_time.rs).
[target.'cfg(not(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly")))'.dependencies]
chrono = { version = "0.4.43", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.21"
chrono = { version = "0.4.43", default-features = false, features = ["std", "now", "serde"] }

[features]
default = ["plugins"]
plugins = ["rquickjs"]

# Binary targets
[[bin]]
name = "sk"
path = "src/bin/sk.rs"

[[bin]]
name = "sk_server"
path = "src/bin/sk_server.rs"

[[bin]]
name = "sk_client"
path = "src/bin/sk_client.rs"

[[bin]]
name = "sk_http_server"
path = "src/bin/sk_http_server.rs"

[[bin]]
name = "sk_http_bench"
path = "src/bin/sk_http_bench.rs"


# Benchmarks (std only, run with `cargo bench --bench <name>`)
[[bench]]
name = "lambda_scope"
harness = false

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "parser_stack"
harness = false
