services:
  skillet-http:
    build: .
    container_name: skillet-http-server
    ports:
      # Published on the host's loopback only. To expose it on other interfaces, set
      # SKILLET_PUBLISH_ADDR (for example 0.0.0.0) and put TLS in front (see the proxy profile).
      - "${SKILLET_PUBLISH_ADDR:-127.0.0.1}:${DOCKER_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      # Worker threads. Worst-case memory about SK_THREADS x (2 x SKILLET_MAX_EVAL_BYTES + 234 MiB
      # for a 1 MiB request, a JS call and the parse cache) + 63 MiB result cache:
      # 4 x 746 MiB + 63 MiB = about 3 GiB. The start-up log prints it (docs/guide/limits.md).
      SK_THREADS: "4"
      SKILLET_HOOKS_DIR: /app/hooks
      # Required. Read from the shell environment or from .env (gitignored; see .env.example).
      # The container refuses to start if either is empty.
      SKILLET_AUTH_TOKEN: ${SKILLET_AUTH_TOKEN:-}
      SKILLET_ADMIN_TOKEN: ${SKILLET_ADMIN_TOKEN:-}
    volumes:
      # Mount hooks directory for persistent JS functions
      - ./hooks:/app/hooks:rw
      # Optional: mount custom hooks from a different location
      # - /path/to/your/hooks:/app/hooks:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skillet.rule=Host(`skillet.localhost`)"
      - "traefik.http.services.skillet.loadbalancer.server.port=8080"

  # Optional: Add a reverse proxy for production
  traefik:
    image: traefik:v3.0
    container_name: skillet-traefik
    profiles:
      - "proxy"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      # The dashboard runs with --api.insecure, so keep it on loopback.
      - "127.0.0.1:8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  default:
    name: skillet-network
